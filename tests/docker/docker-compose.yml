x-pgspec-service: &pgspec-service
  command: ["-c", "shared_preload_libraries=pg_stat_statements"]
  environment:
    POSTGRES_PASSWORD: pgspec
    POSTGRES_DB: pgspec_test
  volumes:
    - ./canary_fixture.sql:/docker-entrypoint-initdb.d/canary_fixture.sql:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  pg14:
    <<: *pgspec-service
    image: postgres:14
    ports:
      - "55414:5432"

  pg15:
    <<: *pgspec-service
    image: postgres:15
    ports:
      - "55415:5432"

  # pg16 stays on its original port: every Milestone 1-11 test targets this
  # DSN directly, not just via the matrix.
  pg16:
    <<: *pgspec-service
    image: postgres:16
    ports:
      - "55432:5432"

  pg17:
    <<: *pgspec-service
    image: postgres:17
    ports:
      - "55417:5432"
